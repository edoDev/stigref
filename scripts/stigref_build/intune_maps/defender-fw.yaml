product: defender-fw
family: microsoft-windows-defender-firewall-with-advanced-security
version: "2"
notes: |
  Windows Defender Firewall STIG → Policy CSP Firewall profiles.
  Domain / Private / Public each have enable + inbound/outbound defaults.

rules:
