    suggestions:
      - csp_id: Policy.Firewall.EnableDomainNetworkFirewall
        value: "1"
        confidence: high
        kind: native
        rationale: Enable firewall on Domain profile.

  - rule_id: SV-241990
    suggestions:
      - csp_id: Policy.Firewall.EnablePrivateNetworkFirewall
        value: "1"
        confidence: high
        kind: native
        rationale: Enable firewall on Private profile.

  - rule_id: SV-241991
    suggestions:
      - csp_id: Policy.Firewall.EnablePublicNetworkFirewall
        value: "1"
        confidence: high
        kind: native
        rationale: Enable firewall on Public profile.

  - rule_id: SV-241992
    suggestions:
      - csp_id: Policy.Firewall.EnableDomainNetworkFirewall
        value: "1"
        confidence: medium
        kind: native
        rationale: Domain inbound block default is companion Firewall CSP (InboundTrafficBlocked); ensure profile enabled.

  - rule_id: SV-241997
    suggestions:
      - csp_id: Policy.Firewall.EnablePrivateNetworkFirewall
        value: "1"
        confidence: medium
        kind: native
        rationale: Private profile inbound block — pair with Firewall CSP inbound policy nodes.

  - rule_id: SV-242002
    suggestions:
