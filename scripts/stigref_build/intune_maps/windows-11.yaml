product: windows-11
family: microsoft-windows-11
version: "1"
notes: |
  Seed curated Intune CSP suggestions for Windows 11 STIG.
  Values are starting points — validate against org baseline and current CSP docs.

rules:
  - rule_id: SV-253260
    suggestions:
      - csp_id: Policy.BitLocker.SystemDrivesRequireStartupAuthentication
        value: "configure TPM+PIN per Learn ADMX payload"
        confidence: high
        kind: native
        rationale: STIG requires BitLocker PIN for pre-boot authentication.
      - csp_id: Policy.BitLocker.RequireDeviceEncryption
        value: "1"
        confidence: medium
        kind: native
        rationale: Related device encryption requirement; may already be covered by Autopilot/BitLocker profiles.

  - rule_id: SV-253261
    suggestions:
      - csp_id: Policy.BitLocker.SystemDrivesMinimumPINLength
        value: "6"
        confidence: high
        kind: native
        rationale: STIG requires minimum six-digit BitLocker PIN.

  - rule_id: SV-253284
    suggestions:
      - csp_id: Policy.MSSecurityGuide.EnableStructuredExceptionHandlingOverwriteProtection
        value: "1"
        confidence: high
        kind: native
        rationale: Enables SEHOP as required by STIG.

  - rule_id: SV-253287
    suggestions:
      - csp_id: Policy.LanmanServer.SMB1
        value: "0"
        confidence: high
        kind: native
        rationale: Disable SMBv1 on SMB server.

  - rule_id: SV-253288
    suggestions:
      - csp_id: Policy.LanmanWorkstation.EnableInsecureGuestLogons
        value: "0"
        confidence: medium
        kind: native
        rationale: Hardening SMB client side; confirm against STIG check (SMB1 client disable may also need optional feature removal).
      - csp_id: Policy.LanmanServer.SMB1
        value: "0"
        confidence: low
        kind: native
        rationale: Alternate related control — server SMB1; client disable is often optional-feature based.

  - rule_id: SV-253291
    suggestions:
      - csp_id: Policy.Connectivity.AllowBluetooth
        value: "0"
        confidence: medium
        kind: native
        rationale: Turn off Bluetooth unless org-approved; multi-option with discoverable mode.
      - csp_id: Policy.Bluetooth.AllowDiscoverableMode
        value: "0"
        confidence: medium
        kind: native
        rationale: If Bluetooth remains enabled, at least block discoverable mode.

  - rule_id: SV-253337
    suggestions:
      - csp_id: Policy.EventLogService.MaxSizeApplicationLog
        value: "32768"
        confidence: medium
        kind: native
        rationale: Application log size ≥ 32768 KB; verify exact CSP channel node for your OS build.

  - rule_id: SV-253338
    suggestions:
      - csp_id: Policy.EventLogService.Channel_Security_MaxSize
        value: "196608"
        confidence: medium
        kind: native
        rationale: Security log sizing — set to org capacity for ≥1 week retention; value is illustrative.
