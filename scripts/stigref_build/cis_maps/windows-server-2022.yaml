product: server-2022
cisBenchmark: CIS Microsoft Windows Server 2022 Benchmark
cisVersion: "operator-maintained"
profile: Level_1
notes: |
  Seed crosswalk. Verify CIS recommendation numbers against your Workbench PDF.

rules:
  - rule_id: SV-254246
    cis:
      - id: "2.3.1"
        title: "Ensure TPM / trusted platform requirements (domain-joined)"
        relationship: related
        confidence: low
        notes: STIG TPM presence vs CIS virtualization-based security sections may differ.

  - rule_id: SV-254248
    cis:
      - id: "18.9.47.1"
        title: "Ensure Windows Defender Antivirus is configured"
        relationship: related
        confidence: medium
        notes: Both require AV; CIS Defender sections are more granular.

  - rule_id: SV-254287
    cis:
      - id: "18.3.1"
        title: "Ensure SMB v1 is disabled"
        relationship: equivalent
        confidence: high
        notes: Common SMBv1 disable control.

  - rule_id: SV-254335
    cis:
      - id: "2.3.7.3"
        title: "Ensure machine inactivity limit is set"
        relationship: equivalent
        confidence: high
        notes: Screen lock / inactivity; confirm seconds vs minutes units.

  - rule_id: SV-254341
    cis:
      - id: "1.1.1"
        title: "Ensure password length is configured"
        relationship: related
        confidence: medium
        notes: Domain GP may supersede MDM CSP paths on servers.

  - rule_id: SV-254342
    cis:
      - id: "1.1.2"
        title: "Ensure password history is configured"
        relationship: related
        confidence: medium
        notes: History counts often differ between STIG and CIS L1/L2.
