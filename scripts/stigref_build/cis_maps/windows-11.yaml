product: windows-11
cisBenchmark: CIS Microsoft Windows 11 Enterprise Benchmark
cisVersion: "operator-maintained"
profile: Level_1
notes: |
  Seed crosswalk for stigref demo. CIS recommendation IDs/titles are illustrative
  operator maps — always verify against the CIS PDF version you assess to.
  Free CIS downloads: https://www.cisecurity.org/cis-benchmarks

rules:
  - rule_id: SV-253260
    cis:
      - id: "3.1.1"
        title: "Ensure BitLocker is enabled for OS drive (verify section in your CIS PDF)"
        relationship: related
        confidence: medium
        notes: STIG focuses pre-boot auth; CIS often frames full-volume encryption + protectors.

  - rule_id: SV-253261
    cis:
      - id: "3.1.2"
        title: "Ensure BitLocker PIN / pre-boot authentication requirements"
        relationship: related
        confidence: medium
        notes: Map to the BitLocker PIN/minimum length recommendations in your CIS edition.

  - rule_id: SV-253284
    cis:
      - id: "18.9.95.1"
        title: "Ensure SEHOP is enabled"
        relationship: equivalent
        confidence: high
        notes: Both require Structured Exception Handling Overwrite Protection.

  - rule_id: SV-253287
    cis:
      - id: "18.3.1"
        title: "Ensure SMB v1 protocol is disabled (server)"
        relationship: equivalent
        confidence: high
        notes: Aligns with disable SMBv1 on SMB server path.

  - rule_id: SV-253288
    cis:
      - id: "18.3.2"
        title: "Ensure SMB insecure guest / client hardening"
        relationship: related
        confidence: medium
        notes: STIG may mix client/server SMB1; CIS often splits recommendations.

  - rule_id: SV-253291
    cis:
      - id: "18.5.4"
        title: "Ensure Bluetooth is configured per policy"
        relationship: partial
        confidence: medium
        notes: CIS may require disable or restricted radio; STIG allows org-approved use cases.

  - rule_id: SV-253337
    cis:
      - id: "18.9.26.1"
        title: "Ensure Application event log size is configured"
        relationship: related
        confidence: medium
        notes: Log sizing thresholds differ by org capacity in both frameworks.

  - rule_id: SV-253338
    cis:
      - id: "18.9.26.2"
        title: "Ensure Security event log size is configured"
        relationship: related
        confidence: medium
        notes: Verify exact KB thresholds in both STIG and CIS for your profile.
