product: edge
cisBenchmark: CIS Microsoft Edge Benchmark
cisVersion: "operator-maintained"
profile: Level_1
notes: |
  Browser benchmarks evolve quickly — re-validate IDs each CIS update.

rules:
  - rule_id: SV-235720
    cis:
      - id: "1.1"
        title: "Ensure Microsoft Defender SmartScreen is enabled"
        relationship: equivalent
        confidence: high
        notes: STIG blocks bypass of SmartScreen site warnings.

  - rule_id: SV-235721
    cis:
      - id: "1.2"
        title: "Ensure SmartScreen download protection is enabled"
        relationship: equivalent
        confidence: high
        notes: Download warning bypass controls.

  - rule_id: SV-235723
    cis:
      - id: "1.5"
        title: "Ensure InPrivate mode is configured"
        relationship: related
        confidence: medium
        notes: CIS may allow limited modes; STIG typically disables InPrivate.

  - rule_id: SV-235725
    cis:
      - id: "1.8"
        title: "Ensure pop-ups are blocked"
        relationship: related
        confidence: medium
        notes: Default pop-up policy alignment.
