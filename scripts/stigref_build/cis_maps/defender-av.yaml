product: defender-av
cisBenchmark: CIS Microsoft Windows Defender Antivirus Benchmark
cisVersion: "operator-maintained"
profile: Level_1
notes: |
  If your org uses the Windows OS CIS benchmark Defender section instead,
  retarget benchmark title/IDs accordingly.

rules:
  - rule_id: SV-213426
    cis:
      - id: "1.1"
        title: "Ensure PUA protection is enabled"
        relationship: equivalent
        confidence: high
        notes: Potentially Unwanted Application blocking.

  - rule_id: SV-213428
    cis:
      - id: "1.2"
        title: "Ensure real-time protection is enabled"
        relationship: equivalent
        confidence: high
        notes: Real-time monitoring must remain on.

  - rule_id: SV-213433
    cis:
      - id: "1.3"
        title: "Ensure cloud-delivered protection is enabled"
        relationship: related
        confidence: medium
        notes: MAPS / cloud protection join requirements.

  - rule_id: SV-213434
    cis:
      - id: "1.4"
        title: "Ensure Microsoft MAPS membership is configured"
        relationship: related
        confidence: medium
        notes: Sample submission levels differ by profile.

  - rule_id: SV-213435
    cis:
      - id: "1.5"
        title: "Ensure sample submission is configured"
        relationship: related
        confidence: medium
        notes: Safe samples vs all samples — confirm org privacy policy.
