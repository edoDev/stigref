# Curated product tags (not inferable from XCCDF alone).
# Match: case-insensitive substring against STIG title (first match wins for quicklink id).
#
# Notes on "intune":
# Public U_ library packages for OS/browser STIGs typically ship XCCDF + PDF only.
# DISA Intune *configuration* packages are often separate downloads. We tag products
# known to have companion Intune/GPO guidance so the UI can surface that honestly.

quick_links:
  - id: windows-11
    label: Windows 11
    match: "Microsoft Windows 11 Security Technical Implementation Guide"
  - id: office-365-proplus
    label: Office 365 ProPlus
    match: "Microsoft Office 365 ProPlus"
  - id: edge
    label: Microsoft Edge
    match: "Microsoft Edge Security Technical Implementation Guide"
  - id: chrome
    label: Google Chrome
    match: "Google Chrome Current Windows"
  - id: defender-av
    label: Defender Antivirus
    match: "Microsoft Defender Antivirus"
  - id: defender-fw
    label: Defender Firewall
    match: "Windows Defender Firewall with Advanced Security"
  - id: server-2025
    label: Server 2025
    match: "Microsoft Windows Server 2025 Security Technical Implementation Guide"
  - id: server-2022
    label: Server 2022
    match: "Microsoft Windows Server 2022 Security Technical Implementation Guide"
  - id: server-2019
    label: Server 2019
    match: "Microsoft Windows Server 2019 Security Technical Implementation Guide"
  - id: adobe-pro
    label: Adobe Acrobat Pro
    match: "Adobe Acrobat Professional DC Continuous"

# Extra tags applied when title contains match (any of)
title_tags:
  - match: "Intune"
    tags: [intune, mdm]
  - match: "Microsoft Windows 11"
    tags: [intune-companion, gpo-companion, microsoft-desktop]
  - match: "Microsoft Windows 10"
    tags: [intune-companion, gpo-companion, microsoft-desktop]
  - match: "Microsoft Windows Server"
    tags: [gpo-companion]
  - match: "Microsoft Edge"
    tags: [intune-companion, browser]
  - match: "Google Chrome"
    tags: [intune-companion, browser]
  - match: "Microsoft Defender Antivirus"
    tags: [intune-companion]
  - match: "Office 365 ProPlus"
    tags: [intune-companion, gpo-companion]
  - match: "Adobe Acrobat Professional"
    tags: [gpo-companion]
