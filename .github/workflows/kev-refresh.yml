name: Refresh CISA KEV

# Weekly refresh of data/threat/* from CISA KEV feed.
# Does not rebuild STIG library data; preserves linkedRules from prior kev.json.

on:
  schedule:
    # Mondays 14:00 UTC (after typical CISA weekly KEV updates)
    - cron: "0 14 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kev-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install pipeline deps
        working-directory: scripts
        run: pip install -r requirements.txt

      - name: Fetch and write KEV catalog
        working-directory: scripts
        run: python refresh_kev.py -v

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/threat/kev.json data/threat/meta.json
          if git diff --staged --quiet; then
            echo "No KEV changes"
            exit 0
          fi
          git commit -m "chore(B-071): refresh CISA KEV catalog"
          git push
